version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-tv-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data
    networks:
      - tv-network

  nginx:
    image: nginx:alpine
    container_name: online-tv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - tv-network

networks:
  tv-network:
    driver: bridge
